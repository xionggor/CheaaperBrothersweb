<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poker Tracker - Cheaper Brothers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #000;
        --panel: #fff;
        --ink: #000;
        --red: #ff2d2d;
        --green: #0fce6b;
        --line: rgba(255,255,255,0.14);
        --dim: rgba(255,255,255,0.5);
        --display-font: "Manufacturing Consent", "Arial Black", sans-serif;
        --title-font: "Oswald", sans-serif;
        --num-font: "Bebas Neue", sans-serif;
        --serif-font: "Noto Serif TC", serif;
        --body-font: "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    html, body { min-height: 100%; }

    body {
        background-color: var(--bg);
        color: #fff;
        font-family: var(--body-font);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 480px; }

    /* ===== 标题区（仿主页导航条：白条 + 圆点 + 大字） ===== */
    .hero { margin-bottom: 22px; }

    .brand-title {
        font-family: var(--display-font);
        font-weight: 400;
        font-size: clamp(2.1rem, 12.5vw, 3.6rem);
        text-transform: uppercase;
        line-height: 0.92;
        letter-spacing: 0.5px;
        margin-bottom: 14px;
    }

    .tracker-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
        color: var(--ink);
        border-radius: 3px;
        padding: 9px 14px;
    }
    .tracker-bar .dot { width: 9px; height: 9px; background: var(--ink); border-radius: 50%; flex-shrink: 0; }
    .tracker-bar .t {
        font-family: var(--title-font);
        font-weight: 600;
        font-size: clamp(1.75rem, 9.5vw, 2.6rem);
        line-height: 0.9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .tracker-bar .cn {
        margin-left: auto;
        font-family: var(--serif-font);
        font-size: 0.8rem;
        letter-spacing: 2px;
        color: rgba(0,0,0,0.55);
        white-space: nowrap;
    }

    /* ===== 单元设置区 ===== */
    .settings-area { margin-bottom: 20px; }

    .setting-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
    }
    .setting-label {
        font-family: var(--title-font);
        font-weight: 500;
        font-size: clamp(1.3rem, 5.5vw, 1.7rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1;
        white-space: nowrap;
    }
    .setting-input {
        background: transparent;
        border: none;
        color: #fff;
        font-family: var(--num-font);
        font-size: clamp(2.4rem, 11vw, 3.4rem);
        line-height: 1;
        width: 42%;
        outline: none;
        text-align: right;
    }

    .pool-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 12px;
    }
    .pool-label {
        font-family: var(--title-font);
        font-weight: 500;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--dim);
    }
    .pool-total {
        font-family: var(--num-font);
        font-size: clamp(1.7rem, 8vw, 2.3rem);
        line-height: 1;
    }

    /* ===== 添加玩家（白条输入） ===== */
    .add-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .add-row input {
        flex: 1;
        min-width: 0;
        background: var(--panel);
        color: var(--ink);
        border: none;
        border-radius: 3px;
        padding: 0 14px;
        height: 48px;
        font-family: var(--title-font);
        font-weight: 500;
        font-size: 1.3rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        outline: none;
    }
    .add-row input::placeholder { color: rgba(0,0,0,0.35); }
    .add-row button {
        background: var(--panel);
        color: var(--ink);
        border: none;
        border-radius: 3px;
        padding: 0 24px;
        height: 48px;
        font-family: var(--title-font);
        font-weight: 600;
        font-size: 1.4rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
    }
    .add-row button:active { background: #e6e6e6; }

    /* ===== 玩家列表 ===== */
    .player-list { display: flex; flex-direction: column; gap: 8px; }

    .player-bar {
        background: var(--panel);
        color: var(--ink);
        border-radius: 3px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }
    .player-bar.active { background: var(--red); color: #fff; }

    .bar-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
    .player-name {
        font-family: var(--title-font);
        font-weight: 600;
        font-size: clamp(1.55rem, 7vw, 2rem);
        line-height: 0.95;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        max-width: 66%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .player-total { font-family: var(--num-font); font-size: clamp(1.8rem, 8vw, 2.4rem); line-height: 1; white-space: nowrap; }

    /* 结算行（CASH OUT 模式） */
    .settle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 10px;
        border-top: 1px dashed rgba(0,0,0,0.22);
    }
    .player-bar.active .settle-row { border-top-color: rgba(255,255,255,0.35); }

    .cash-input {
        width: 46%;
        height: 44px;
        border: 1px solid rgba(0,0,0,0.25);
        border-radius: 3px;
        background: rgba(0,0,0,0.05);
        color: var(--ink);
        font-family: var(--num-font);
        font-size: 1.3rem;
        text-align: center;
        outline: none;
    }
    .player-bar.active .cash-input { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); color: #fff; }

    .result-display { font-family: var(--num-font); font-size: 1.25rem; text-align: right; white-space: nowrap; }
    .status-loss { color: var(--red); font-weight: 400; }
    .status-profit { color: var(--green); font-weight: 400; }
    .player-bar.active .status-loss { color: #fff; }
    .player-bar.active .status-profit { color: #fff; }

    /* 控制行 */
    .bar-sub {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px solid rgba(0,0,0,0.12);
    }
    .player-bar.active .bar-sub { border-top-color: rgba(255,255,255,0.3); }

    .controls { display: flex; align-items: center; gap: 12px; }
    .btn-step {
        width: 44px;
        height: 44px;
        background: var(--ink);
        color: #fff;
        border: none;
        border-radius: 3px;
        font-size: 1.35rem;
        font-weight: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .btn-step:active { transform: scale(0.92); }
    .player-bar.active .btn-step { background: #fff; color: var(--red); }

    .unit-display {
        font-family: var(--num-font);
        font-size: 1.05rem;
        letter-spacing: 1px;
        opacity: 0.75;
        white-space: nowrap;
    }

    .remove-link {
        font-family: var(--title-font);
        font-weight: 500;
        font-size: 1.05rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: inherit;
        opacity: 0.65;
        cursor: pointer;
        border: none;
        background: transparent;
        padding: 10px 6px;
    }
    .remove-link:active { opacity: 1; }

    /* ===== 空状态 / 提示 ===== */
    .empty-hint {
        text-align: center;
        color: rgba(255,255,255,0.3);
        font-family: var(--title-font);
        font-weight: 500;
        font-size: 1.25rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 52px 0;
    }
    .standup-hint {
        text-align: center;
        color: rgba(255,255,255,0.35);
        font-family: var(--title-font);
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin: 12px 0 2px;
    }

    /* ===== 结算清单 ===== */
    .settlement-summary-section { margin-top: 34px; display: none; }

    .summary-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--title-font);
        font-weight: 600;
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
    }
    .summary-title::before { content: ''; width: 9px; height: 9px; background: #fff; border-radius: 50%; flex-shrink: 0; }

    .settle-bill-bar {
        background: var(--panel);
        color: var(--ink);
        border-radius: 3px;
        padding: 12px 14px;
        margin-bottom: 8px;
        cursor: pointer;
    }

    .bill-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .bill-name { font-family: var(--title-font); font-weight: 600; font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1; }
    .bill-tag { font-size: 0.7rem; letter-spacing: 1px; opacity: 0.5; margin-left: 5px; }
    .bill-amount { font-family: var(--num-font); font-size: clamp(1.7rem, 8vw, 2.1rem); line-height: 1.05; text-align: right; white-space: nowrap; }

    .bill-detail {
        max-height: 0;
        overflow: hidden;
        transition: all 0.3s ease;
        font-family: var(--title-font);
        font-weight: 500;
        font-size: 1.05rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    .settle-bill-bar.open .bill-detail {
        max-height: 500px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #ccc;
    }
    .instruction-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; align-items: baseline; }

    /* ===== 底部按钮（白条菜单风格） ===== */
    .footer-actions {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
    }
    .btn {
        display: block;
        width: 100%;
        background: var(--panel);
        color: var(--ink);
        border: none;
        border-radius: 3px;
        padding: 14px;
        height: 48px;
        font-family: var(--title-font);
        font-weight: 600;
        font-size: 1.45rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
    }
    .btn:active { background: #e6e6e6; }
    .btn.active { background: var(--red); color: #fff; }
    .btn.active:active { background: #e02828; }

    footer {
        margin: 52px 0 8px;
        font-family: var(--serif-font);
        font-size: 0.82rem;
        letter-spacing: 1px;
        color: #fff;
        opacity: 0.7;
        text-align: center;
    }
    footer a { color: inherit; text-decoration: none; }
</style>
</head>
<body>

    <div class="container">

        <header class="hero">
            <div class="brand-title">Cheaper Brothers</div>
            <div class="tracker-bar">
                <div class="dot"></div>
                <div class="t">Poker Tracker</div>
                <div class="cn">德州計分器</div>
            </div>
        </header>

        <div class="settings-area">
            <div class="setting-row">
                <div class="setting-label">UNIT BASIS ￥</div>
                <input type="number" id="unitValue" value="30" min="1" class="setting-input" oninput="updateStorage()">
            </div>
            <div class="pool-row">
                <div class="pool-label">POOL TOTAL</div>
                <div id="totalBankDisplay" class="pool-total">￥0</div>
            </div>
        </div>

        <div class="add-row">
            <input type="text" id="playerName" placeholder="ENTER PLAYER NAME" maxlength="24" onkeydown="if(event.key==='Enter') addPlayer()">
            <button onclick="addPlayer()">ADD</button>
        </div>

        <div id="playerList" class="player-list"></div>

        <div id="standupHint" class="standup-hint" style="display:none;">TAP A PLAYER TO STAND UP · LAST ONE PAYS</div>

        <div id="summarySection" class="settlement-summary-section">
            <div class="summary-title">Settlement List</div>
            <div id="summaryList"></div>
        </div>

        <div class="footer-actions">
            <button id="calcModeBtn" class="btn" onclick="toggleCalcMode()">CASH OUT</button>
            <button id="generateBtn" class="btn btn-generate" style="display:none;" onclick="calculateDebts()">GENERATE BILLS</button>
            <button class="btn" onclick="clearAllData()">RESET ALL</button>
        </div>

        <footer>
            <a href="https://cheaperbrothers.dpdns.org/index.html">Cheaper Brothers Co. 廉兄集团</a>
        </footer>

    </div>

    <script>
        let players = [];
        let isCalcMode = false;
        let usdRate = 7.23;

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function fmt(n) { return Math.round(n).toLocaleString(); }

        function hideSummary() { document.getElementById('summarySection').style.display = 'none'; }

        async function fetchExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/CNY');
                const data = await response.json();
                if (data && data.rates && data.rates.USD) {
                    usdRate = parseFloat((1 / data.rates.USD).toFixed(2));
                }
            } catch (error) { console.warn("Using default rate."); }
        }

        window.onload = function() {
            fetchExchangeRate();
            const savedPlayers = localStorage.getItem('poker_players');
            const savedUnit = localStorage.getItem('poker_unit');
            if (savedPlayers) { try { players = JSON.parse(savedPlayers); } catch (e) { players = []; } }
            if (savedUnit) document.getElementById('unitValue').value = savedUnit;
            renderTable();
        };

        function updateStorage() {
            localStorage.setItem('poker_players', JSON.stringify(players));
            localStorage.setItem('poker_unit', document.getElementById('unitValue').value);
            hideSummary();
            renderTable();
        }

        function toggleCalcMode() {
            isCalcMode = !isCalcMode;
            document.getElementById('calcModeBtn').classList.toggle('active', isCalcMode);
            document.getElementById('calcModeBtn').textContent = isCalcMode ? 'EXIT' : 'CASH OUT';
            document.getElementById('generateBtn').style.display = isCalcMode ? 'block' : 'none';
            if (!isCalcMode) document.getElementById('summarySection').style.display = 'none';
            renderTable();
        }

        function updateBankTotal() {
            const unit = parseFloat(document.getElementById('unitValue').value) || 0;
            const total = players.reduce((sum, p) => sum + (p.groups * unit), 0);
            document.getElementById('totalBankDisplay').innerText = '￥' + total.toLocaleString();
            return total;
        }

        function calculateDebts() {
            if (players.length === 0) return;
            const unitValue = parseFloat(document.getElementById('unitValue').value) || 0;
            const poolTotal = updateBankTotal();
            const handTotal = players.reduce((sum, p) => sum + (parseFloat(p.handCash) || 0), 0);

            if (Math.abs(poolTotal - handTotal) > 5) {
                alert(`账目不平 (BALANCE ERROR)\n偏差超出允许范围(±5)\n当前总买入: ￥${poolTotal}\n剩余总计: ￥${handTotal}`);
                return;
            }

            let debtors = []; 
            let creditors = []; 
            let totalNet = 0;

            players.forEach(p => {
                const net = (p.groups * unitValue) - (parseFloat(p.handCash) || 0);
                totalNet += net;
                if (net > 0) debtors.push({ name: p.name, amount: net, trans: [], initial: net });
                else if (net < 0) creditors.push({ name: p.name, amount: Math.abs(net), trans: [], initial: Math.abs(net) });
            });

            if (Math.abs(totalNet) > 0 && Math.abs(totalNet) <= 5) {
                if (totalNet > 0 && creditors.length > 0) creditors[0].amount += totalNet;
                else if (totalNet < 0 && debtors.length > 0) debtors[0].amount += Math.abs(totalNet);
            }

            let dIdx = 0, cIdx = 0;
            let safety = 0;
            while (dIdx < debtors.length && cIdx < creditors.length && safety < 100) {
                safety++;
                let d = debtors[dIdx];
                let c = creditors[cIdx];
                let settle = Math.min(d.amount, c.amount);

                if (settle > 0) {
                    // 统一使用 target 属性，避免 undefined
                    d.trans.push({ target: c.name, val: settle, type: 'PAY' });
                    c.trans.push({ target: d.name, val: settle, type: 'REC' });
                    d.amount -= settle;
                    c.amount -= settle;
                }
                if (d.amount <= 0.01) dIdx++;
                if (c.amount <= 0.01) cIdx++;
            }
            renderSummary(debtors, creditors);
        }

        function renderSummary(debtors, creditors) {
            const section = document.getElementById('summarySection');
            const list = document.getElementById('summaryList');
            section.style.display = 'block';
            list.innerHTML = "";

            const allSettle = [...debtors, ...creditors];
            allSettle.forEach(item => {
                const isDebtor = debtors.includes(item);
                const bar = document.createElement('div');
                bar.className = 'settle-bill-bar';
                bar.onclick = () => bar.classList.toggle('open');

                const initialUsd = (item.initial / usdRate).toFixed(2);
                const sign = isDebtor ? '-' : '+';
                const usdSign = isDebtor ? '-' : '';

                let details = item.trans.map(t => {
                    const tUsd = (t.val / usdRate).toFixed(2);
                    // 修复：这里直接使用 t.target
                    const label = t.type === 'PAY' ? `PAY TO ${escapeHtml(t.target)}` : `FROM ${escapeHtml(t.target)}`;
                    return `
                        <div class="instruction-row">
                            <span>${label}</span>
                            <span>￥${fmt(t.val)} <small style="opacity:0.6; font-size:0.75rem;">(US$${tUsd})</small></span>
                        </div>`;
                }).join('');

                bar.innerHTML = `
                    <div class="bill-header">
                        <div class="bill-name">${escapeHtml(item.name)} <span class="bill-tag">${isDebtor ? 'DEBTOR' : 'CREDITOR'}</span></div>
                        <div class="bill-amount" style="color:${isDebtor ? 'var(--red)' : 'var(--green)'}">
                            ${sign}${fmt(item.initial)}
                            <div style="font-size:0.75rem; opacity:0.7; text-align:right;">${usdSign}US$${initialUsd}</div>
                        </div>
                    </div>
                    <div class="bill-detail">
                        <div style="font-size:0.7rem; margin-bottom:8px; opacity:0.5; letter-spacing:1px;">RATE: 1 USD = ${usdRate} CNY</div>
                        ${details}
                    </div>
                `;
                list.appendChild(bar);
            });
            window.scrollTo({ top: section.offsetTop, behavior: 'smooth' });
        }

        function updateHandCash(id, val) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.handCash = val;
                hideSummary();
                const unitValue = parseFloat(document.getElementById('unitValue').value) || 0;
                const buyInTotal = player.groups * unitValue;
                const hand = parseFloat(val) || 0;
                const result = buyInTotal - hand;
                const displayEl = document.getElementById('res-' + id);

                if (val === "") { displayEl.innerText = "WAITING"; displayEl.className = "result-display"; }
                else if (result > 0) { displayEl.innerText = "LOSS ￥" + result; displayEl.className = "result-display status-loss"; }
                else if (result < 0) { displayEl.innerText = "PROFIT ￥" + Math.abs(result); displayEl.className = "result-display status-profit"; }
                else { displayEl.innerText = "EVEN"; displayEl.className = "result-display"; }
                localStorage.setItem('poker_players', JSON.stringify(players));
            }
        }

        function addPlayer() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim().slice(0, 24);
            if (name === "") return;
            players.push({ id: "ID_" + Date.now(), name: name, groups: 1, standup: false, handCash: "" });
            nameInput.value = "";
            updateStorage();
        }

        function changeGroup(event, id, delta) {
            event.stopPropagation(); 
            const player = players.find(p => p.id === id);
            if (player) { player.groups += delta; if (player.groups < 1) player.groups = 1; updateStorage(); }
        }

        function toggleStandup(id) {
            const player = players.find(p => p.id === id);
            if (!player) return;
            if (player.standup) { player.standup = false; updateStorage(); }
            else {
                player.standup = true; updateStorage(); 
                const checked = players.filter(p => p.standup).length;
                if (players.length > 1 && checked === players.length - 1) {
                    const loser = players.find(p => !p.standup);
                    setTimeout(() => { alert((loser ? loser.name : "PLAYER").toUpperCase() + " PAYS THE PRICE! 💰"); clearAllStandups(); }, 100);
                }
            }
        }

        function clearAllStandups() { players.forEach(p => p.standup = false); updateStorage(); }
        function deletePlayer(event, id) { event.stopPropagation(); if(confirm("REMOVE PLAYER?")) { players = players.filter(p => p.id !== id); updateStorage(); } }
        function clearAllData() { if(confirm("RESET ENTIRE SYSTEM?")) { players = []; updateStorage(); } }

        function renderTable() {
            const unit = parseFloat(document.getElementById('unitValue').value) || 0;
            const container = document.getElementById('playerList');
            container.innerHTML = "";
            const hint = document.getElementById('standupHint');
            if (players.length === 0) {
                container.innerHTML = '<div class="empty-hint">ADD PLAYERS TO START</div>';
                if (hint) hint.style.display = 'none';
            } else if (hint) {
                hint.style.display = isCalcMode ? 'none' : 'block';
            }
            players.forEach(player => {
                const buyIn = player.groups * unit;
                const bar = document.createElement('div');
                bar.className = player.standup ? 'player-bar active' : 'player-bar';
                bar.onclick = () => toggleStandup(player.id);
                
                let settleUI = "";
                if (isCalcMode) {
                    const hand = parseFloat(player.handCash) || 0;
                    const res = buyIn - hand;
                    let resText = "WAITING", resClass = "";
                    if (player.handCash !== "") {
                        if (res > 0) { resText = "LOSS ￥" + res; resClass = "status-loss"; }
                        else if (res < 0) { resText = "PROFIT ￥" + Math.abs(res); resClass = "status-profit"; }
                        else { resText = "EVEN"; }
                    }
                    settleUI = `<div class="settle-row" onclick="event.stopPropagation()">
                        <input type="number" class="cash-input" placeholder="HAND CASH" min="0" value="${escapeHtml(player.handCash)}" oninput="updateHandCash('${player.id}', this.value)">
                        <div id="res-${player.id}" class="result-display ${resClass}">${resText}</div>
                    </div>`;
                }

                bar.innerHTML = `
                    <div class="bar-main">
                        <div class="player-name">${escapeHtml(player.name)}</div>
                        <div class="player-total">￥${buyIn.toLocaleString()}</div>
                    </div>
                    ${settleUI}
                    <div class="bar-sub">
                        <div class="controls">
                            <button class="btn-step" onclick="changeGroup(event, '${player.id}', -1)">-</button>
                            <span class="unit-display">${player.groups} UNITS</span>
                            <button class="btn-step" onclick="changeGroup(event, '${player.id}', 1)">+</button>
                        </div>
                        <button class="remove-link" onclick="deletePlayer(event, '${player.id}')">Remove</button>
                    </div>
                `;
                container.appendChild(bar);
            });
            updateBankTotal();
        }
    </script>
</body>
</html>

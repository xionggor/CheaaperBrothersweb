<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Gallery - Cheaper Brothers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Alumni+Sans+Pinstripe:ital@0;1&family=Bebas+Neue&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">

<style>
/* 共享样式 */
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background-color: #000; color: #fff; overflow-x: hidden; }
#font-loader { font-family: "Manufacturing Consent", system-ui; position: absolute; opacity: 0; pointer-events: none; }
footer { margin-top: auto; padding: 30px; font-family: "Noto Serif TC", serif; font-size: 0.9rem; opacity: 0.8; letter-spacing: 1px; text-align: center; width: 100%; }
footer a { color: inherit; text-decoration: none; transition: opacity 0.3s; }
footer a:hover { opacity: 1; }

/* 导航栏样式 */
:root { --nav-bg: #ffffff; --nav-text: #000000; --primary-font: "Alumni Sans Pinstripe", sans-serif; --nav-transition: 0.5s; --nav-delay: 0.08s; }
.nav-wrapper { position: fixed; top: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; padding-bottom: 40px; }
.nav-trigger { width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#fuzzy-nav-icon { width: 100%; height: 100%; }
.menu-list { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; width: 210px; pointer-events: none; }
.menu-bar { background-color: var(--nav-bg); border-radius: 3px; padding: 1px 12px; color: var(--nav-text); text-decoration: none; cursor: pointer; transform: translateY(-15px); opacity: 0; transition: all var(--nav-transition) cubic-bezier(0.23, 1, 0.32, 1); display: flex; flex-direction: column; justify-content: center; height: 45px; }
.menu-bar:nth-child(1) { transition-delay: calc(var(--nav-delay) * 2); }
.menu-bar:nth-child(2) { transition-delay: calc(var(--nav-delay) * 1); }
.menu-bar:nth-child(3) { transition-delay: 0s; }
.nav-wrapper.active .menu-list { pointer-events: auto; }
.nav-wrapper.active .menu-bar { transform: translateY(0); opacity: 1; }
.nav-wrapper.active .menu-bar:nth-child(1) { transition-delay: 0s; }
.nav-wrapper.active .menu-bar:nth-child(2) { transition-delay: var(--nav-delay); }
.nav-wrapper.active .menu-bar:nth-child(3) { transition-delay: calc(var(--nav-delay) * 2); }
.bar-title { font-family: var(--primary-font); font-size: 2.6rem; font-weight: 400; text-transform: uppercase; display: flex; align-items: center; line-height: 0.8; margin: 0; }
.dot { width: 8px; height: 8px; background-color: var(--nav-text); border-radius: 50%; margin-right: 10px; flex-shrink: 0; }

/* 动效照片墙 */
.header-canvas { margin: 10vh 0 5vh 0; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 90%; max-width: 1200px; margin-bottom: 10vh; }

@keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
}

.gallery-item {
    position: relative; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 4px; cursor: pointer;
    opacity: 0; /* 初始隐藏，由动画接管 */
    animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

/* 阶梯式入场延迟 */
.gallery-item:nth-child(1) { animation-delay: 0.1s; }
.gallery-item:nth-child(2) { animation-delay: 0.2s; }
.gallery-item:nth-child(3) { animation-delay: 0.3s; }
.gallery-item:nth-child(4) { animation-delay: 0.4s; }
.gallery-item:nth-child(5) { animation-delay: 0.5s; }
.gallery-item:nth-child(6) { animation-delay: 0.6s; }

.gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(1.1); transition: all 0.5s ease; }
.gallery-item:hover img { filter: grayscale(0%) contrast(1); transform: scale(1.05); }
</style>
</head>
<body>

<div class="nav-wrapper" id="navWrapper">
    <div class="nav-trigger" id="navTrigger"><canvas id="fuzzy-nav-icon"></canvas></div>
    <div class="menu-list">
        <a href="apps.html" class="menu-bar"><div class="bar-title"><div class="dot"></div>APPS</div></a>
        <a href="art.html" class="menu-bar"><div class="bar-title"><div class="dot"></div>Art</div></a>
        <a href="about.html" class="menu-bar"><div class="bar-title">About</div></a>
    </div>
</div>

<div id="font-loader">Force Font Load</div>

<div class="header-canvas">
    <canvas id="fuzzy-title-art"></canvas>
</div>

<div class="gallery-grid">
    <!-- 请替换 src 为真实的图片路径 -->
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=1" alt="Art 1"></div>
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=2" alt="Art 2"></div>
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=3" alt="Art 3"></div>
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=4" alt="Art 4"></div>
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=5" alt="Art 5"></div>
    <div class="gallery-item"><img src="https://picsum.photos/600/400?random=6" alt="Art 6"></div>
</div>

<footer>
    <a href="index.html">Cheaper Brothers Co. 廉兄集团</a>
</footer>

<script>
// 压缩版 FuzzyText 类与通用逻辑
class FuzzyText{constructor(t,e={}){this.canvas=document.getElementById(t);if(!this.canvas)return;this.text=e.text||"",this.fontSize=e.fontSize||80,this.fontWeight=e.fontWeight||400,this.fontFamily=e.fontFamily||"sans-serif",this.color=e.color||"#fff",this.baseIntensity=e.baseIntensity||.18,this.hoverIntensity=e.hoverIntensity||.5,this.fuzzRange=e.fuzzRange||30,this.enableHover=!1!==e.enableHover,this.ctx=this.canvas.getContext("2d"),this.offscreen=document.createElement("canvas"),this.offCtx=this.offscreen.getContext("2d"),this.isHovering=!1,this.animationFrameId=null,this.handleMouseMove=this.handleMouseMove.bind(this),this.handleMouseLeave=this.handleMouseLeave.bind(this),this.animate=this.animate.bind(this),this.resize=this.resize.bind(this),this.init()}async init(){try{await document.fonts.load('400 80px "Manufacturing Consent"')}catch(t){}await document.fonts.ready,setTimeout(()=>{this.resize(),this.startAnimation()},100),this.enableHover&&(this.canvas.addEventListener("mousemove",this.handleMouseMove),this.canvas.addEventListener("mouseleave",this.handleMouseLeave),this.canvas.addEventListener("touchstart",()=>this.isHovering=!0),this.canvas.addEventListener("touchend",()=>this.isHovering=!1)),window.addEventListener("resize",this.resize)}resize(){let t="fuzzy-nav-icon"===this.canvas.id,e=window.innerWidth,s=this.fontSize;!t&&e<600&&(s=this.fontSize*.6);let i=`${this.fontWeight} ${s}px "${this.fontFamily}"`;this.offCtx.font=i;let n=this.offCtx.measureText(this.text),a=Math.ceil(n.width),h=Math.ceil(1.5*s);this.offscreen.width=a+10,this.offscreen.height=h,this.offCtx.font=i,this.offCtx.fillStyle=this.color,this.offCtx.textBaseline="middle",this.offCtx.fillText(this.text,5,h/2),this.width=this.offscreen.width+2*this.fuzzRange,this.height=this.offscreen.height,this.canvas.width=this.width,this.canvas.height=this.height,t&&(this.canvas.style.width="35px",this.canvas.style.height="35px")}handleMouseMove(){this.isHovering=!0}handleMouseLeave(){this.isHovering=!1}animate(){this.ctx.clearRect(0,0,this.width,this.height);let t=this.isHovering?this.hoverIntensity:this.baseIntensity;for(let e=0;e<this.offscreen.height;e++){let s=Math.floor(t*(Math.random()-.5)*this.fuzzRange);this.ctx.drawImage(this.offscreen,0,e,this.offscreen.width,1,s+this.fuzzRange,e,this.offscreen.width,1)}this.animationFrameId=requestAnimationFrame(this.animate)}startAnimation(){this.animationFrameId||this.animate()}}

const commonConfig = { fontFamily: "Manufacturing Consent", fontWeight: 400, color: '#ffffff', baseIntensity: 0.15, hoverIntensity: 0.5, fuzzRange: 30 };
new FuzzyText('fuzzy-nav-icon', { ...commonConfig, text: "■", fontSize: 40, fuzzRange: 15, baseIntensity: 0.2 });
new FuzzyText('fuzzy-title-art', { ...commonConfig, text: "ART GALLERY", fontSize: 60 });

const wrapper = document.getElementById('navWrapper');
const trigger = document.getElementById('navTrigger');
trigger.addEventListener('mouseenter', () => wrapper.classList.add('active'));
wrapper.addEventListener('mouseleave', () => wrapper.classList.remove('active'));
trigger.addEventListener('click', (e) => { e.stopPropagation(); wrapper.classList.toggle('active'); });
</script>
</body>
</html>
